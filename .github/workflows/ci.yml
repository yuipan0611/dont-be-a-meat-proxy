name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node 22 / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: client
            command: node --test client/test/*.test.mjs
          - suite: bot
            package: bot
            command: npm test --prefix bot
          - suite: web
            package: web
            command: npm test --prefix web
          - suite: gateway
            command: node --test ops/llm-gateway/test/*.test.mjs
          - suite: bridge
            command: node --test ops/memory-bridge/test/*.test.mjs
          - suite: bank-proxy
            package: ops/bank-proxy
            command: npm test --prefix ops/bank-proxy
          - suite: acceptance
            command: node --test ops/acceptance/test/*.test.mjs
          - suite: lifecycle-eval-readiness
            command: node --test ops/lifecycle/test/*.test.mjs ops/eval/test/*.test.mjs ops/test/readiness.test.mjs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install SQLite for the local gateway backup fixture
        if: matrix.suite == 'gateway'
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3
      - name: Install locked dependencies
        if: matrix.package
        run: npm ci --prefix "${PACKAGE_DIR}" --ignore-scripts --no-audit --no-fund
        env:
          PACKAGE_DIR: ${{ matrix.package }}
      - name: Run suite
        run: ${{ matrix.command }}

  python:
    name: Python ops
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install backup and configuration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age caddy sqlite3
      - name: Test operator scripts
        run: python3 -m unittest discover -s ops/test -p 'test_*.py' -v
        env:
          HUB_TEST_NO_DOCKER: '1'

  validator:
    name: Go validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/validator/go.mod
          cache-dependency-path: server/validator/go.sum
      - name: Test validator
        working-directory: server/validator
        run: go test -count=1 -v ./...
